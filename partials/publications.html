<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Publications" />
  <title>Publication • thinhbui</title>

  <link rel="stylesheet" href="../css/header.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/contact.css" />
  <link rel="stylesheet" href="../css/publication.css" />
  <link rel="icon" href="../img/favicon.png" type="image/x-icon">
  <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
</head>

<body>
  <div data-include="/partials/header.html"></div>

  <section class="section" id="publications" aria-label="Publications">
    <div class="container">
      <div class="section-head">
        <div>
          <!-- Left filters: Type + Index -->
          <div style="display:flex; gap:12px; flex-wrap:wrap; align-items:center;">
            <div class="year-pill">
              <span class="year-pill__label">Type:</span>
              <select class="select year-pill__select" id="pubType" aria-label="Filter by type">
                <option value="all">All</option>
                <option value="conference">Conference</option>
                <option value="journal">Journal</option>
                <option value="preprint">Preprint</option>
              </select>
            </div>

            <div class="year-pill">
              <span class="year-pill__label">Index:</span>
              <select class="select year-pill__select" id="pubIndex" aria-label="Filter by indexing">
                <option value="all">All</option>
                <option value="wos">WoS</option>
                <option value="scopus">Scopus</option>
              </select>
            </div>
          </div>
        </div>

        <div class="section-actions">
          <div class="year-pill">
            <span class="year-pill__label">Year:</span>
            <select class="select year-pill__select" id="pubYear" aria-label="Filter by year">
              <option value="all">All</option>
            </select>
          </div>
        </div>
      </div>

      <div id="pubList" class="pub-groups" aria-live="polite"></div>
      <p style="display: flex; justify-content: end;"> 1st: First Author / corr: Corresponding Author</p>

    </div>
  </section>

  <div data-include="/partials/footer.html"></div>

  <script src="../js/main.js"></script>
  <script src="../js/visitors.js"></script>
  
</body>
</html>
