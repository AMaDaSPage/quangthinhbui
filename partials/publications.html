<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Publications" />
  <title>Publication • thinhbui</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/header.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/footer.css" />
  <link rel="stylesheet" href="../css/contact.css" />
  <link rel="stylesheet" href="../css/publication.css" />
  <link rel="icon" href="../img/favicon.png" type="image/x-icon">
  <link rel="shortcut icon" href="../img/favicon.png" type="image/x-icon">
</head>

<body>
  <div data-include="/partials/header.html"></div>

  <section class="section" id="publications" aria-label="Publications">
    <div class="hero-media">
      <img src="/img/quangthinhbui.png" alt="Publications banner" />
    </div>

    <div class="container">
      <div class="publications-box">

        <!-- Tiêu đề giống ảnh -->
        <div class="pub-page-head">
          <div class="pub-page-tabs" id="pubTypeTabs" aria-label="Filter by publication type">
            <button class="pub-tab is-active" type="button" data-type="all">All</button>
            <button class="pub-tab" type="button" data-type="conference">Conference</button>
            <button class="pub-tab" type="button" data-type="journal">Journal</button>
          </div>
           <div class="section-head">
            <div class="section-head__left"></div>

            <div class="section-actions">
              <div class="year-pill">
                <span class="year-pill__label">Year:</span>
                <select class="select year-pill__select" id="pubYear" aria-label="Filter by year">
                  <option value="all">All</option>
                </select>
              </div>
            </div>
          </div>
        </div>

        <div id="pubList" class="pub-groups" aria-live="polite"></div>
      </div>
    </div>
  </section>

  <div data-include="/partials/footer.html"></div>

  <script src="../js/main.js"></script>
  <script src="../js/visitors.js"></script>
  <script src="../js/publications.js"></script>

  <script>
    window.addEventListener("DOMContentLoaded", () => {
      window.initPublications({
        targetId: "pubList",
        yearId: "pubYear",
        typeTabsId: "pubTypeTabs",
        jsonUrl: "/publications.json"
      });
    });
  </script>
</body>
</html>
