<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="description" content="Contact" />
  <title>Contact • thinhbui</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/header.css" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/footer.css" />
  <link rel="stylesheet" href="/css/contact.css" />


  <link rel="icon" href="/img/favicon.png" type="image/x-icon">
  <link rel="shortcut icon" href="/img/favicon.png" type="image/x-icon">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

  
</head>

<body>
  <div data-include="/partials/header.html"></div>

  <main id="home">
    <section class="section contact-page" id="contact" aria-label="Contact">
      <div class="hero-media">
            <img src="/img/quangthinhbui.png" alt="Team photo" />
      </div>
      <div class="container">
        <div class="section-head">
          <div>
          </div>
        </div>

        <div class="contact-layout">
          <aside class="contact-aside">
            <div class="card contact-card">
              <div class="contact-profile-lines">
                <div class="contact-meta contact-meta--stack">
                  <div><strong>Tien Giang University</strong></div>
                  <span>Office of Research, Technology Management and International Cooperation</span>
                  <span>Room B.339, Than Binh Hamlet, Chau Thanh Commune, Dong Thap, Vietnam</span>
                </div>

                <div class="contact-meta contact-meta--stack">
                  <div><strong>Email:</strong></div>

                  <div class="email-row">
                    <span>- Personal:</span>
                    <a class="contact-email" href="mailto:qthinhbui@gmail.com">qthinhbui@gmail.com</a>
                    <button type="button" class="copy-email" data-email="qthinhbui@gmail.com" title="Copy">
                      <i class="fa-regular fa-copy"></i>
                    </button>
                  </div>

                  <div class="email-row">
                    <span>- Institutional:</span>
                    <a class="contact-email" href="mailto:buiquangthinh@tgu.edu.vn">buiquangthinh@tgu.edu.vn</a>
                    <button type="button" class="copy-email" data-email="buiquangthinh@tgu.edu.vn" title="Copy">
                      <i class="fa-regular fa-copy"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <div class="card contact-card map-card">
              <div class="contact-card-head">
                <span class="contact-icon" aria-hidden="true">📍</span>
                <h3 class="card-title">Address</h3>
              </div>

              <div class="map-embed" aria-label="Tien Giang University map">
                <iframe
                  src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d80520.75534753523!2d106.28677440515388!3d10.433152845903587!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x310abb77abfeb299%3A0x3047216743107681!2zVHLGsOG7nW5nIMSQ4bqhaSBo4buNYyBUaeG7gW4gR2lhbmcgY8ahIHPhu58gMg!5e1!3m2!1svi!2s!4v1766425822127!5m2!1svi!2s"
                  allowfullscreen=""
                  loading="lazy"
                  referrerpolicy="no-referrer-when-downgrade">
                </iframe>
              </div>
            </div>
          </aside>

          <section class="card contact-card contact-form-card" aria-label="Send a message">
            <div class="contact-card-head">
              <span class="contact-icon" aria-hidden="true">📝</span>
              <h3 class="contact-role">Send a message</h3>
            </div>

            <form class="form" id="mailtoForm">
              <label class="label">
                Your name
                <input class="input" id="mName" type="text" placeholder="Your name" autocomplete="name" />
              </label>

              <label class="label">
                Your email
                <input class="input" id="mEmail" type="email" placeholder="your@email.com" autocomplete="email" />
              </label>

              <label class="label">
                Subject
                <input class="input" id="mSubject" type="text" placeholder="Collaboration / talk / supervision..." />
              </label>

              <label class="label">
                Message
                <textarea class="textarea" id="mBody" rows="6" placeholder="Write your message..."></textarea>
              </label>

              <div class="contact-actions">
                <button class="btn primary" type="submit">Send</button>
                <button class="btn ghost" type="reset">Clear</button>
              </div>
            </form>
          </section>
        </div>
      </div>
    </section>
  </main>

  <div data-include="/partials/footer.html"></div>

  <script src="/js/main.js"></script>
  <script src="/js/mailto.js"></script>
  <script src="/js/copy.js"></script>
  <script src="/js/visitors.js"></script>

 
</body>
</html>
